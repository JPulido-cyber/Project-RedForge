  <g transform="translate(70 336)"><rect class="row" width="1060" height="78"/><text class="h" x="30" y="33">CLIENT</text><text class="s" x="285" y="33">TBD</text><text class="s" x="455" y="33">TBD</text><text class="s" x="680" y="33">Managed endpoints</text><text class="k" x="950" y="33">IN PROGRESS</text></g>
